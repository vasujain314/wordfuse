<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Word Fuse – Free Word Game | Play Solo or with Friends Online</title>
    <meta
      name="description"
      content="A fast, free word game: type a real word containing the letters before the fuse burns out. Play solo or with friends online. No sign-up."
    />
    <meta
      name="keywords"
      content="word game, word puzzle, free word game, online word game, multiplayer word game, word game with friends, vocabulary game, spelling game, typing game, brain game"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Word Fuse" />
    <link rel="canonical" href="https://wordfuse.expo.app/home" />

    <!-- App look and install -->
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Word Fuse" />
    <meta name="apple-mobile-web-app-title" content="Word Fuse" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      rel="preload"
      href="/fonts/CourierPrime-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="preload" href="/fonts/CourierPrime-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Link previews (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Word Fuse" />
    <meta property="og:title" content="Word Fuse – Free Word Game" />
    <meta
      property="og:description"
      content="Type a word containing the letters before the fuse burns out. Play solo or challenge friends with a link."
    />
    <meta property="og:url" content="https://wordfuse.expo.app/" />
    <meta property="og:image" content="https://wordfuse.expo.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://wordfuse.expo.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Word Fuse: a typewriter-style word game" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Word Fuse – Free Word Game" />
    <meta
      name="twitter:description"
      content="Type a word containing the letters before the fuse burns out. Play solo or with friends."
    />
    <meta name="twitter:image" content="https://wordfuse.expo.app/og-image.jpg" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Word Fuse",
        "url": "https://wordfuse.expo.app/",
        "image": "https://wordfuse.expo.app/og-image.jpg",
        "description": "A fast word game: type a real English word containing the given letters before the fuse burns out. Play solo or with up to 8 friends online.",
        "genre": ["Word game", "Puzzle", "Party game"],
        "gamePlatform": ["Web browser", "Android"],
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web, Android",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 1, "maxValue": 8 },
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f4f1ea;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Typewriter font (Courier Prime, OFL), served with the page and preloaded above. The
         family names match the ones the app uses on every platform. */
      @font-face {
        font-family: 'CourierPrime_400Regular';
        src: url('/fonts/CourierPrime-Regular.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: 'CourierPrime_700Bold';
        src: url('/fonts/CourierPrime-Bold.ttf') format('truetype');
        font-display: block;
      }
      /* Static first-paint copy of Home (#shell). Mirrors the React Native Web layout. */
      body {
        margin: 0;
      }
      .wf-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: #f4f1ea;
      }
      .wf-shell div,
      .wf-shell a,
      .wf-shell span {
        box-sizing: border-box;
      }
      .wf-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
      }
      .wf-title {
        font-family: 'CourierPrime_700Bold';
        color: #1d1c1a;
        font-size: 40px;
      }
      .wf-tagline {
        font-family: 'CourierPrime_400Regular';
        color: #57534b;
        font-size: 15px;
        line-height: 22px;
        text-align: center;
      }
      .wf-rule {
        width: 120px;
        height: 1px;
        background-color: #d6d0c2;
      }
      .wf-best {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .wf-best-label,
      .wf-best-meta {
        font-family: 'CourierPrime_400Regular';
        color: #9a958a;
        font-size: 14px;
      }
      .wf-best-meta {
        font-size: 13px;
      }
      .wf-best-value {
        font-family: 'CourierPrime_700Bold';
        color: #1d1c1a;
        font-size: 48px;
      }
      .wf-buttons {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }
      .wf-button {
        min-height: 52px;
        min-width: 200px;
        padding: 0 24px;
        display: flex;
        flex-direction: row;
        gap: 8px;
        align-items: center;
        justify-content: center;
        border: 1.5px solid #1d1c1a;
        border-radius: 2px;
        text-decoration: none;
        font-family: 'CourierPrime_700Bold';
        color: #1d1c1a;
        font-size: 18px;
        letter-spacing: 1px;
      }
      .wf-footer {
        align-self: center;
        min-height: 48px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-family: 'CourierPrime_400Regular';
        color: #9a958a;
        font-size: 13px;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <noscript>
      Word Fuse is a free word game: type a word containing the letters before the fuse burns out.
      Please enable JavaScript to play.
    </noscript>
    <div id="root">
      <!-- First paint: a static copy of the Home screen, shown while the app's JavaScript
           loads (React replaces it with the identical live screen). Links work without JS.
           Removed at once on any other page. Keep in sync with src/screens/HomeScreen.js. -->
      <div id="shell" class="wf-shell">
        <div class="wf-center">
          <div class="wf-title">word fuse</div>
          <div class="wf-tagline">
            type a word containing the letters<br />before the fuse burns out.
          </div>
          <div class="wf-rule"></div>
          <div class="wf-best">
            <div class="wf-best-label">best</div>
            <div class="wf-best-value" id="shell-best">0</div>
            <div class="wf-best-meta">2 lives · 10s per word</div>
          </div>
          <div class="wf-buttons">
            <a class="wf-button" href="/game">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1D1C1A"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>play</span>
            </a>
            <a class="wf-button" href="/multiplayer">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#1D1C1A"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span>multiplayer</span>
            </a>
          </div>
        </div>
        <a class="wf-footer" href="/privacy"><span>privacy</span></a>
      </div>
      <script>
        (function () {
          var shell = document.getElementById('shell');
          if (!/^\/(home\/?)?$/.test(location.pathname)) {
            shell.remove();
            return;
          }
          try {
            var best = JSON.parse(localStorage.getItem('wordfuse:best:L2_T10') || 'null');
            if (best && best.bestScore > 0) {
              document.getElementById('shell-best').textContent = String(best.bestScore);
            }
          } catch (e) {}
        })();
      </script>
    </div>
  </body>
</html>
