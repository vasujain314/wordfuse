      <p>

      <!-- help:start (generated by `npm run build:help` from src/content/help.js) -->
      <h2>How to play Word Fuse</h2>
      <h3>The idea</h3>
      <p>You get a few letters, like ON. Type a real English word that contains them together, in that order (PROTON, STONE, ONION), and press enter before the fuse burns out.</p>
      <h3>Scoring</h3>
      <p>Every word is one point. You have 10 seconds a word, and a word can only be used once per game. A wrong word just shows why (missing letters, not in the dictionary, already used) so you can try again before time runs out.</p>
      <h3>Lives</h3>
      <p>You start with 2 lives. Let the fuse burn out and you lose one, and the game shows a word that would have worked. Lose both and the game is over. Beat your best score and you get a &quot;new best&quot; stamp.</p>
      <h3>Getting harder</h3>
      <p>The more words you find, the harder the letters get: first common pairs like ON or ST, then three letters, then rarer combinations.</p>
      <h3>Playing with friends</h3>
      <p>Tap multiplayer, enter your name and host a game, then share the link or the 4-letter room code. Friends join from the app or straight from a web browser, no install needed. 2 to 8 players sit around the table and take turns, and everyone watches the active player type live. Each turn has new letters, everyone has 2 lives, and the last player standing wins. The leaderboard ranks everyone by words found.</p>
      <h3>Tips</h3>
      <p>Plurals and verb forms count (STONES, TONED). Think of words where the letters sit at the start, the middle or the end. Short words are fine: speed beats length.</p>
      <h2>Frequently asked questions</h2>
      <h3>Is Word Fuse free?</h3>
      <p>Yes. Word Fuse is free to play on the web and on Android. It shows a few ads, never during a turn.</p>
      <h3>Do I need an account?</h3>
      <p>No. There is no sign-up. Your best score is saved on your device.</p>
      <h3>How do I play with friends online?</h3>
      <p>Tap multiplayer, enter your name and host a game, then share the link or the room code. Friends open the link in the app or in any web browser and join the lobby. When everyone is in, the host starts the game.</p>
      <h3>How many players can play together?</h3>
      <p>From 2 to 8 players. Anyone who joins after the game has started can watch and play in the next game.</p>
      <h3>Which words are allowed?</h3>
      <p>Any word in the 168,000-word English dictionary the game uses, including plurals and verb forms, as long as it contains the letters shown together and in order. Names and abbreviations do not count, and each word can be used once per game.</p>
      <h3>Can I play on iPhone?</h3>
      <p>Yes, in Safari or any browser at wordfuse.expo.app, including multiplayer with friends on Android. There is no iPhone app yet.</p>
      <h3>Does Word Fuse work offline?</h3>
      <p>Single player works offline in the Android app. Multiplayer needs an internet connection.</p>
      <h3>Does it get harder?</h3>
      <p>Yes. The more words you find, the harder the letters get. In multiplayer, the letters get harder each time the turn goes all the way round the table.</p>
      <h3>What data does Word Fuse keep?</h3>
      <p>Word Fuse has no accounts and keeps no database of players. Your best score stays on your device, multiplayer names are only passed between the players in a room, and ads come from Google. See the privacy policy for details.</p>
      <!-- help:end -->

      <script>
        (function () {
          var shell = document.getElementById('shell');
          if (!/^\/(home\/?)?$/.test(location.pathname)) {
            shell.remove();
            return;
          }
          // Same rule as SHOW_GET_APP in src/screens/HomeScreen.js (and SHOW_APP_DOWNLOAD in
          // src/core/links.js): no Play Store button on iPhone/iPad.
          var showGetApp = false;
          var ua = navigator.userAgent;
          var ios =
            /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
          if (!showGetApp || ios) document.getElementById('shell-get-app').remove();
          try {
            var best = JSON.parse(localStorage.getItem('wordfuse:best:L2_T10') || 'null');
            if (best && best.bestScore > 0) {
              document.getElementById('shell-best').textContent = String(best.bestScore);
            }
          } catch (e) {}
        })();
